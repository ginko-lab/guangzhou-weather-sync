name: Sync Guangzhou Weather & Air to Turso

on:
  schedule:
    # 每小时整点运行 (UTC)，对应北京时间每小时
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync script
        env:
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: python sync_turso.py